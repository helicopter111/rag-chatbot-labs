# Docker Compose is a recipe: one command starts Postgres with pgvector
# already installed. The database runs in a container (a box) so we do not
# install Postgres into Windows itself.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe data: docker compose down -v

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rag_pgdata:
